<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ejercicio 1 - Tabla sencilla</title>
    <style type="text/css">
        td, th { border: 1px solid #CCC; padding: 8px; }
        table { border: 1px solid black; border-collapse: collapse; width: 50%; }
    </style>
</head>
<body>
    <h1>Ejercicio 1: Tabla sencilla</h1>
    <table>
        <thead>
            <tr>
                <th scope="col">Album</th>
                <th scope="col">Year</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Rubber Soul</td>
                <td>1965</td>
            </tr>
            <tr>
                <td>Revolver</td>
                <td>1966</td>
            </tr>
            <tr>
                <td>Sgt. Pepper's</td>
                <td>1967</td>
            </tr>
            <tr>
                <td>The White Album</td>
                <td>1968</td>
            </tr>
            <tr>
                <td>Abbey Road</td>
                <td>1969</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
